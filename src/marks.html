<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: https:">
<title>Riffle more bookmarks</title>
<style>
:root { --bar: #fff; --ink: #14212b; --muted: #46555f; --hover: #d7e6ec; color-scheme: light; }
:root.dark { --bar: #262b2f; --ink: #edf1f4; --muted: #c3ccd2; --hover: #3a4a52; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bar); color: var(--ink); font: 13px "Segoe UI", sans-serif; user-select: none; }
body { padding: 8px 0; overflow-y: auto; }
button { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 12px; border: 0; background: none; color: inherit; font: inherit; text-align: left; }
button:hover, button:focus { background: var(--hover); outline: none; }
button span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
svg, img { flex: none; width: 16px; height: 16px; }
svg { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
</style>
<div id="items" role="menu" aria-label="More bookmarks"></div>
<script>
const send = (cmd, extra) => window.ipc.postMessage(JSON.stringify({cmd, ...extra}));
const GLOBE = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>';
function render(state) {
  document.documentElement.classList.toggle('dark', state.theme === 'dark' || state.private || (state.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches));
  document.getElementById('items').replaceChildren(...state.marks.map(m => {
    const b = document.createElement('button');
    b.setAttribute('role', 'menuitem');
    b.title = m.title + '\n' + m.url;
    b.innerHTML = GLOBE;
    if (m.icon) {
      const img = new Image();
      img.alt = '';
      img.onload = () => b.firstChild.replaceWith(img);
      img.src = m.icon;
    }
    const label = document.createElement('span');
    label.textContent = m.title || m.url;
    b.append(label);
    b.onclick = () => send('marks_pick', {value: m.url});
    return b;
  }));
  document.querySelector('button')?.focus();
}
addEventListener('keydown', e => {
  if (e.key === 'Escape') return send('marks_close');
  const all = [...document.querySelectorAll('button')], at = all.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); all[(at + 1) % all.length].focus(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); all[(at + all.length - 1) % all.length].focus(); }
});
addEventListener('blur', () => setTimeout(() => { if (!document.hasFocus()) send('marks_close'); }, 100));
send('marks_ready');
</script>
</html>
