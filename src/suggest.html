<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Riffle suggestions</title>
<style>
:root { --accent: #0b6e8f; --strip: color-mix(in srgb, var(--accent) 9%, #eef1f4); --page: color-mix(in srgb, var(--accent) 3%, #f6f8fa); --bar: #ffffff; --ink: #14212b; --hover: color-mix(in srgb, var(--accent) 18%, transparent); --line: color-mix(in srgb, var(--accent) 18%, #d5dade); --edge: color-mix(in srgb, var(--accent) 30%, #6d7478); --field: color-mix(in srgb, var(--accent) 6%, #f5f7f9); --muted: #46555f; --off: #6b7780; --track: #8a959c; --fill: oklch(from var(--accent) min(l, .5) c h); --tint: oklch(from var(--accent) min(l, .45) c h); --shadow: 0 1px 2px rgb(16 40 60 / .10), 0 6px 18px rgb(16 40 60 / .10); color-scheme: light; }
:root.dark { --strip: color-mix(in srgb, var(--accent) 8%, #15191c); --page: color-mix(in srgb, var(--accent) 3%, #1a1e21); --bar: color-mix(in srgb, var(--accent) 9%, #262b2f); --ink: #edf1f4; --hover: color-mix(in srgb, var(--accent) 34%, transparent); --line: color-mix(in srgb, var(--accent) 20%, #3f464b); --edge: color-mix(in srgb, var(--accent) 20%, #8b949a); --field: color-mix(in srgb, var(--accent) 6%, #171b1e); --muted: #c3ccd2; --off: #a8b2b9; --track: #8b949a; --fill: oklch(from var(--accent) min(l, .5) c h); --tint: oklch(from var(--accent) max(l, .8) c h); --shadow: 0 1px 2px rgb(0 0 0 / .40), 0 8px 22px rgb(0 0 0 / .35); color-scheme: dark; }
:root { --strip: #f1f3f4; --page: #fff; --bar: #fff; --ink: #1f1f1f; --muted: #5f6368; --line: #dadce0; --edge: #80868b; --hover: #e8f0f4; --field: #f1f3f4; }
:root.dark { --strip: #202124; --page: #202124; --bar: #292a2d; --ink: #e8eaed; --muted: #bdc1c6; --line: #3c4043; --edge: #9aa0a6; --hover: #3c4043; --field: #202124; }
* { box-sizing: border-box; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; color: var(--tint); }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bar); color: var(--ink); font: 13px "Segoe UI", sans-serif; user-select: none; }
#items { padding: 4px 0; }
.row { display: flex; align-items: center; gap: 12px; height: 32px; padding: 0 12px; }
.row:hover, .row.on { background: var(--hover); }
.text { flex: none; max-width: 60%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.url { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: 12px; }
</style>
<!--ICONS-->
<div id="items" role="listbox" aria-label="Suggestions"></div>
<script>
const send = (cmd, extra) => window.ipc.postMessage(JSON.stringify({cmd, ...extra}));
const items = document.getElementById('items');
const icon = name => {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'i');
  svg.setAttribute('aria-hidden', 'true');
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', '#i-' + name);
  svg.append(use);
  return svg;
};
function render(state) {
  document.documentElement.style.setProperty('--accent', state.accent);
  document.documentElement.classList.toggle('dark', state.theme === 'dark' || state.private || (state.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches));
  items.replaceChildren(...state.items.map(item => {
    const row = document.createElement('div');
    row.className = 'row';
    row.setAttribute('role', 'option');
    const text = document.createElement('span');
    text.className = 'text';
    text.textContent = item.text; // textContent: titles and suggestions come from websites
    const url = document.createElement('span');
    url.className = 'url';
    url.textContent = item.url || '';
    row.append(icon(item.url ? 'clock' : 'search'), text, url);
    // On press rather than click: pressing here takes focus from the address bar, which closes this list.
    row.onmousedown = () => send('go', {value: item.url || item.text});
    return row;
  }));
}
function mark(at) { [...items.children].forEach((row, i) => row.classList.toggle('on', i === at)); }
send('suggest_ready');
</script>
</html>
